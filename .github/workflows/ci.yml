name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: appofc

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Prepare environment file
        run: cp .env.example .env && cp .env backend/.env

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Validate Prisma schema
        run: bun run prisma:validate

      - name: Prettier check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Audit dependencies
        run: bun run audit

  integration:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autodisplay
          POSTGRES_PASSWORD: autodisplay_test
          POSTGRES_DB: autodisplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autodisplay -d autodisplay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://autodisplay:autodisplay_test@localhost:5432/autodisplay_test
      AUTH_EMPRESA_ID: 00000000-0000-4000-8000-000000000001
      AUTH_CSRF_SECRET: integration-test-csrf-secret-min-32!!
      AUTH_SESSION_IDLE_MINUTES: 30
      AUTH_SESSION_ABSOLUTE_HOURS: 12
      AUTH_MAX_SESSIONS_PER_USER: 3
      NODE_ENV: test
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Assert empty database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          table_count=$(psql "$DATABASE_URL" -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")
          test "$table_count" = "0"

      - name: Apply migrations
        run: bun run prisma:migrate:deploy

      - name: Integration tests
        run: bun run test:integration
