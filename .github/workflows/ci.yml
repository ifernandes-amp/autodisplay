name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: appofc

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364ed1afde

      - name: Setup Bun
        uses: oven-sh/setup-bun@735729ba7d4209ea3837a737dadcae380875e97
        with:
          bun-version: 1.4.0

      - name: Prepare environment file
        run: cp .env.example .env && cp .env backend/.env

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Validate Prisma schema
        run: bun run prisma:validate

      - name: Prettier check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Audit dependencies
        run: bun run audit
